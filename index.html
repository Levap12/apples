<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Симулятор</title>
  <style>html,body{margin:0;min-height:100%;background:#042c2a}body{box-sizing:border-box;padding:16px}</style>
</head>
<body>
<div id="fortune-board">
  <style>
    #fortune-board{max-width:480px;margin:auto;font-family:ui-rounded,system-ui,sans-serif;color:#f7fff8}
    #fortune-board .frame{overflow:hidden;border:2px solid #114f4b;border-radius:20px;background:#053f3c;box-shadow:0 16px 42px #001b1a88}
    #fortune-board .field{padding:18px 13px 15px;background:radial-gradient(circle at 80% 16%,#5b913b77 0 5%,transparent 19%),radial-gradient(circle at 25% 75%,#15908a66 0 6%,transparent 29%),linear-gradient(125deg,#034d4c 8%,#075852 51%,#1c6b42 100%);position:relative}
    #fortune-board .field:before{content:"";position:absolute;inset:0;opacity:.32;background:repeating-linear-gradient(110deg,transparent 0 36px,#003d3a80 37px 39px);pointer-events:none}#fortune-board .caption{position:relative;z-index:1;padding:1px 0 10px;text-align:center;font-size:13px;font-weight:500;letter-spacing:.18em;color:#d9ec93;text-shadow:0 2px 5px #002620}
    #fortune-board .ladder{position:relative;display:grid;gap:7px}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;align-items:center}
    #fortune-board .slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;border:2px solid #773315;background:linear-gradient(145deg,#dd8a45 2%,#8e3b17 57%,#55210e 100%);box-shadow:inset 8px 9px 0 #ffc77742,inset -7px -9px 0 #36120788,0 4px 0 #00656b,0 6px 9px #001c1a99;overflow:hidden}.slot:before{content:"";position:absolute;inset:12% 7%;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 12%,#4c1d0c8c 14% 16%,transparent 18% 26%);mix-blend-mode:multiply}.slot:after{content:"";position:absolute;left:17%;top:10%;width:35%;height:17%;border-radius:50%;transform:rotate(-25deg);background:#ffe3a766}.slot .icon{z-index:1;font-size:clamp(19px,5vw,34px);filter:drop-shadow(0 2px 1px #52200c)}
    #fortune-board .apple{border-color:#15733d;background:radial-gradient(circle at 32% 26%,#ffaaa0 0 7%,transparent 8%),linear-gradient(145deg,#279c4c,#0b5429 67%,#07361d);box-shadow:inset 8px 9px 0 #b4ffaf44,inset -7px -9px 0 #003716aa,0 4px 0 #00656b,0 6px 9px #001c1a99;filter:brightness(1.15);animation:fortune-pulse .65s ease-out}@keyframes fortune-pulse{from{transform:scale(.72);opacity:.2}to{transform:scale(1);opacity:1}}
    #fortune-board .footer{display:flex;align-items:center;justify-content:center;padding:12px 16px;background:#062f2c;border-top:1px solid #21716a}.actions{display:flex;gap:7px}.play{border:0;border-radius:9px;padding:8px 13px;background:linear-gradient(#8fca55,#4e963b);box-shadow:inset 0 1px #dcf5aa,0 2px #235b2b;color:#fff;font:500 13px inherit;cursor:pointer}.play:hover{filter:brightness(1.1)}.play.secondary{background:linear-gradient(#287e78,#125955)}
    @media(max-width:430px){body{padding:8px}#fortune-board .field{padding:12px 8px}.row{gap:5px}.ladder{gap:5px}}
  </style>
  <section class="frame" aria-label="Игровое поле">
    <main class="field"><div class="caption">SERDIK WIN</div><div class="ladder" id="ladder" aria-label="Игровое поле"></div></main>
    <footer class="footer"><div class="actions"><button type="button" class="play secondary" id="next">Следующий ход</button><button type="button" class="play" id="reset">Новый раунд</button></div></footer>
  </section>
  <script>
    (()=>{const root=document.getElementById('fortune-board'),$=s=>root.querySelector(s),rows=9;let level=rows-1;function build(){$('#ladder').innerHTML=Array.from({length:rows},(_,i)=>'<div class="row" data-level="'+i+'">'+Array.from({length:5},()=>'<div class="slot"></div>').join('')+'</div>').join('');}function reset(){level=rows-1;build();$('#next').disabled=false;$('#next').textContent='Следующий ход';}function next(){if(level<0)return;const shownLevel=level,cells=[...root.querySelectorAll('.row[data-level="'+shownLevel+'"] .slot')],cell=cells[Math.floor(Math.random()*cells.length)];cell.classList.add('apple');cell.innerHTML='<span class="icon">🍎</span>';level--;if(level<0){$('#next').textContent='Финиш';$('#next').disabled=true;}}$('#next').onclick=next;$('#reset').onclick=reset;reset();})();
  </script>
</div>
</body>
</html>
