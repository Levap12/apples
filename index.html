<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Симулятор</title>
  <style>html,body{margin:0;min-height:100%;background:#042c2a}body{box-sizing:border-box;padding:16px}</style>
</head>
<body>
<div id="fortune-board">
  <style>
    #fortune-board{max-width:480px;margin:auto;font-family:ui-rounded,system-ui,sans-serif;color:#f7fff8}
    #fortune-board .frame{overflow:hidden;border:2px solid #114f4b;border-radius:20px;background:#053f3c;box-shadow:0 16px 42px #001b1a88}
    #fortune-board .field{padding:18px 13px 15px;background:radial-gradient(circle at 80% 16%,#5b913b77 0 5%,transparent 19%),radial-gradient(circle at 25% 75%,#15908a66 0 6%,transparent 29%),linear-gradient(125deg,#034d4c 8%,#075852 51%,#1c6b42 100%);position:relative}
    #fortune-board .field:before{content:"";position:absolute;inset:0;opacity:.32;background:repeating-linear-gradient(110deg,transparent 0 36px,#003d3a80 37px 39px);pointer-events:none}#fortune-board .caption{position:relative;z-index:1;padding:1px 0 10px;text-align:center;font-size:13px;font-weight:500;letter-spacing:.18em;color:#d9ec93;text-shadow:0 2px 5px #002620}
    #fortune-board .ladder{position:relative;display:grid;gap:7px}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;align-items:center}
    #fortune-board .slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;border:2px solid #773315;background:linear-gradient(145deg,#dd8a45 2%,#8e3b17 57%,#55210e 100%);box-shadow:inset 8px 9px 0 #ffc77742,inset -7px -9px 0 #36120788,0 4px 0 #00656b,0 6px 9px #001c1a99;overflow:hidden}.slot:before{content:"";position:absolute;inset:12% 7%;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 12%,#4c1d0c8c 14% 16%,transparent 18% 26%);mix-blend-mode:multiply}.slot:after{content:"";position:absolute;left:17%;top:10%;width:35%;height:17%;border-radius:50%;transform:rotate(-25deg);background:#ffe3a766}.slot .icon{z-index:1;font-size:clamp(19px,5vw,34px);filter:drop-shadow(0 2px 1px #52200c)}
    #fortune-board .apple{border-color:#15733d;background:radial-gradient(circle at 32% 26%,#ffaaa0 0 7%,transparent 8%),linear-gradient(145deg,#279c4c,#0b5429 67%,#07361d);box-shadow:inset 8px 9px 0 #b4ffaf44,inset -7px -9px 0 #003716aa,0 4px 0 #00656b,0 6px 9px #001c1a99;filter:brightness(1.15);animation:fortune-pulse .65s ease-out}@keyframes fortune-pulse{from{transform:scale(.72);opacity:.2}to{transform:scale(1);opacity:1}}
    #fortune-board .footer{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 16px;background:#062f2c;border-top:1px solid #21716a}.settings{display:none;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:330px;padding-top:5px}.settings.open{display:flex}.picker{display:flex;align-items:center;gap:8px;font-size:12px;color:#cbe8d4}.picker select{border:1px solid #277269;border-radius:6px;padding:4px 7px;background:#083d39;color:#f7fff8;font:inherit}.config{display:none;width:100%;gap:5px}.config.open{display:grid}.plan-row{display:grid;grid-template-columns:42px repeat(5,1fr);gap:5px;align-items:center}.plan-row span{font-size:10px;color:#cbe8d4}.plan-cell{aspect-ratio:1;border:1px solid #38786d;border-radius:50%;background:#0a4d47;cursor:pointer}.plan-cell.active{background:#c9d45e;border-color:#f0f4a1;box-shadow:0 0 8px #d8e25a99}.actions{display:flex;gap:7px}.gear{position:absolute;right:12px;bottom:13px;border:0;background:transparent;color:#74a69c;font:20px system-ui;cursor:pointer}.play{border:0;border-radius:9px;padding:8px 13px;background:linear-gradient(#8fca55,#4e963b);box-shadow:inset 0 1px #dcf5aa,0 2px #235b2b;color:#fff;font:500 13px inherit;cursor:pointer}.play:hover{filter:brightness(1.1)}.play.secondary{background:linear-gradient(#287e78,#125955)}
    @media(max-width:430px){body{padding:8px}#fortune-board .field{padding:12px 8px}.row{gap:5px}.ladder{gap:5px}}
  </style>
  <section class="frame" aria-label="Игровое поле">
    <main class="field"><div class="caption">CERDIC WIN</div><div class="ladder" id="ladder" aria-label="Игровое поле"></div></main>
    <footer class="footer"><div class="actions"><button type="button" class="play secondary" id="next">Next move</button><button type="button" class="play" id="reset">New round</button></div><button type="button" class="gear" id="settings" aria-label="Settings">⚙</button><div class="settings" id="settingsPanel"><label class="picker"><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="fr">Français (Cameroun)</option></select></label><label class="picker"><span id="modeLabel">Mode</span><select id="mode"><option value="manual" id="manualOption">Custom field</option><option value="random" id="randomOption">Random field</option></select></label><button type="button" class="play secondary" id="config">Configure field</button><div class="config" id="configPanel" aria-label="Field configuration"></div><button type="button" class="play" id="save">Save</button></div></footer>
  </section>
  <script>
    (()=>{const root=document.getElementById('fortune-board'),$=s=>root.querySelector(s),rows=9,plan=Array(rows).fill(null),copy={en:{language:'Language',mode:'Mode',manual:'Custom field',random:'Random field',configure:'Configure field',save:'Save',next:'Next move',round:'New round',settings:'Settings',move:'Move',cell:'cell',finish:'Finish'},fr:{language:'Langue',mode:'Mode',manual:'Champ personnalisé',random:'Champ aléatoire',configure:'Configurer le champ',save:'Enregistrer',next:'Coup suivant',round:'Nouveau tour',settings:'Paramètres',move:'Coup',cell:'case',finish:'Terminé'}};let level=rows-1,lang='en';function localize(){const t=copy[lang];$('#languageLabel').textContent=t.language;$('#modeLabel').textContent=t.mode;$('#manualOption').textContent=t.manual;$('#randomOption').textContent=t.random;$('#config').textContent=t.configure;$('#save').textContent=t.save;$('#next').textContent=level<0?t.finish:t.next;$('#reset').textContent=t.round;$('#settings').setAttribute('aria-label',t.settings);}function build(){$('#ladder').innerHTML=Array.from({length:rows},(_,i)=>'<div class="row" data-level="'+i+'">'+Array.from({length:5},()=>'<div class="slot"></div>').join('')+'</div>').join('');}function renderConfig(){const t=copy[lang];$('#configPanel').innerHTML=plan.map((column,row)=>'<div class="plan-row"><span>'+t.move+' '+(rows-row)+'</span>'+Array.from({length:5},(_,col)=>'<button type="button" class="plan-cell '+(column===col?'active':'')+'" data-row="'+row+'" data-col="'+col+'" aria-label="'+t.move+' '+(rows-row)+', '+t.cell+' '+(col+1)+'"></button>').join('')+'</div>').join('');}function reset(){level=rows-1;build();$('#next').disabled=false;localize();}function next(){if(level<0)return;const shownLevel=level,cells=[...root.querySelectorAll('.row[data-level="'+shownLevel+'"] .slot')],column=$('#mode').value==='random'||plan[shownLevel]===null?Math.floor(Math.random()*cells.length):plan[shownLevel],cell=cells[column];cell.classList.add('apple');cell.innerHTML='<span class="icon">🍎</span>';level--;if(level<0){$('#next').textContent=copy[lang].finish;$('#next').disabled=true;}}$('#settings').onclick=()=>{$('#settingsPanel').classList.toggle('open');};$('#config').onclick=()=>{const panel=$('#configPanel'),open=panel.classList.toggle('open');if(open)renderConfig();};$('#configPanel').onclick=event=>{const button=event.target.closest('button[data-row]');if(!button)return;plan[+button.dataset.row]=+button.dataset.col;renderConfig();};$('#save').onclick=()=>{$('#configPanel').classList.remove('open');$('#settingsPanel').classList.remove('open');};$('#language').onchange=event=>{lang=event.target.value;localize();if($('#configPanel').classList.contains('open'))renderConfig();};$('#next').onclick=next;$('#reset').onclick=reset;localize();reset();})();
  </script>
</div>
</body>
</html>
