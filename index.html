<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apples Simulator</title>
  <style>html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 12% 10%,#5d9d42 0,transparent 28%),radial-gradient(ellipse at 88% 76%,#1a6c42 0,transparent 33%),linear-gradient(145deg,#061d17 0%,#0c4b35 48%,#173a23 100%)}body{box-sizing:border-box;padding:18px;background-attachment:fixed}</style>
</head>
<body>
<div id="fortune-board">
  <style>
    #fortune-board{max-width:510px;margin:auto;font-family:ui-rounded,system-ui,sans-serif;color:#fff}
    #fortune-board .frame{overflow:hidden;border:7px solid #4d2716;border-radius:17px;background:#1c100e;box-shadow:inset 0 0 0 3px #c88945,0 16px 40px #041c10aa;position:relative}
    #fortune-board .frame:before,#fortune-board .frame:after{content:"🌿";position:absolute;z-index:4;font-size:41px;pointer-events:none;filter:drop-shadow(1px 2px #17270d)}#fortune-board .frame:before{left:-5px;top:5px;transform:rotate(-27deg)}#fortune-board .frame:after{right:-6px;bottom:2px;transform:rotate(150deg)}
    #fortune-board .field{padding:13px 13px 14px;background:linear-gradient(105deg,#56301e,#9b5b31 46%,#512b1b);position:relative}.field:before{content:"";position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(175deg,transparent 0 27px,#f2b47122 28px 31px);pointer-events:none}
    #fortune-board .caption{position:relative;z-index:1;margin:-1px -1px 12px;padding:11px 8px;text-align:center;font-size:clamp(16px,4vw,22px);font-weight:500;letter-spacing:.08em;background:linear-gradient(#261917,#0e0909);border:2px solid #84502d;border-radius:8px;color:#fff;text-shadow:0 2px 2px #000}
    #fortune-board .ladder{position:relative;display:grid;gap:5px}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;align-items:center;padding:2px;border-radius:6px}.row.played{background:linear-gradient(90deg,#83ec9255,#baff9855,#83ec9255);box-shadow:0 0 12px #75ff83a6}
    #fortune-board .slot{aspect-ratio:1.48;border-radius:4px;display:grid;place-items:center;position:relative;border:2px solid #5e2c1b;background:linear-gradient(165deg,#ffd38d 0%,#d78b50 23%,#a8512c 88%);box-shadow:inset 0 3px #fff1bb8f,inset 0 -4px #5e2517a6,0 2px #301009;overflow:hidden}.slot:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(5deg,transparent 0 12px,#6f301b48 13px 15px),linear-gradient(96deg,transparent 45%,#ffe0a44d 48%,transparent 52%)}.slot:after{content:"";position:absolute;left:12%;top:18%;width:25%;height:1px;transform:rotate(-24deg);background:#6a301a99}.slot .icon{z-index:1;font-size:clamp(20px,5.5vw,36px);filter:drop-shadow(0 2px 1px #54200b)}
    #fortune-board .apple{border-color:#2c7a17;background:radial-gradient(circle at 34% 23%,#c8ff94 0 5%,transparent 6%),linear-gradient(135deg,#75d925,#238d16 64%,#135e0e);box-shadow:inset 0 3px #d3ff9b88,inset 0 -4px #125010a8,0 2px #301009;animation:fortune-pulse .45s ease-out}@keyframes fortune-pulse{from{transform:scale(.72);opacity:.2}to{transform:scale(1);opacity:1}}
    #fortune-board .footer{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 16px;background:linear-gradient(#281612,#140b0a);border-top:3px solid #84502d}.settings{display:none;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:330px;padding-top:5px}.settings.open{display:flex}.picker{display:flex;align-items:center;gap:8px;font-size:12px;color:#ffe5b4}.picker select{border:1px solid #9a623a;border-radius:6px;padding:4px 7px;background:#382017;color:#fff;font:inherit}.config{display:none;width:100%;gap:5px}.config.open{display:grid}.plan-row{display:grid;grid-template-columns:42px repeat(5,1fr);gap:5px;align-items:center}.plan-row span{font-size:10px;color:#ffe5b4}.plan-cell{aspect-ratio:1;border:1px solid #9a623a;border-radius:50%;background:#593526;cursor:pointer}.plan-cell.active{background:#84bc3d;border-color:#f0f4a1;box-shadow:0 0 8px #d8e25a99}.actions{display:flex;gap:8px;justify-content:center}.gear{position:absolute;right:12px;bottom:13px;border:0;background:transparent;color:#c59c75;font:20px system-ui;cursor:pointer}.play{border:1px solid #a77042;border-radius:7px;padding:8px 14px;background:linear-gradient(#99d85c,#4a8f32);box-shadow:inset 0 1px #e4ffb6,0 2px #26120d;color:#fff;font:500 13px inherit;cursor:pointer}.play:hover{filter:brightness(1.1)}.play.secondary{background:linear-gradient(#c0834e,#7c4126)}
    @media(max-width:430px){body{padding:8px}#fortune-board .field{padding:10px 8px}.row{gap:4px}.ladder{gap:4px}}
  </style>
  <section class="frame" aria-label="Игровое поле">
    <main class="field"><div class="caption">CERDIC PRO</div><div class="ladder" id="ladder" aria-label="Игровое поле"></div></main>
    <footer class="footer"><div class="actions"><button type="button" class="play secondary" id="next">Next move</button><button type="button" class="play" id="reset">New round</button></div><button type="button" class="gear" id="settings" aria-label="Settings">⚙</button><div class="settings" id="settingsPanel"><label class="picker"><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="fr">Français (Cameroun)</option></select></label><label class="picker"><span id="modeLabel">Mode</span><select id="mode"><option value="manual" id="manualOption">Custom field</option><option value="random" id="randomOption">Random field</option></select></label><button type="button" class="play secondary" id="config">Configure field</button><div class="config" id="configPanel" aria-label="Field configuration"></div><button type="button" class="play" id="save">Save</button></div></footer>
  </section>
  <script>
    (()=>{const root=document.getElementById('fortune-board'),$=s=>root.querySelector(s),rows=9,plan=Array(rows).fill(null),copy={en:{language:'Language',mode:'Mode',manual:'Custom field',random:'Random field',configure:'Configure field',save:'Save',next:'Next move',round:'New round',settings:'Settings',move:'Move',cell:'cell',finish:'Finish'},fr:{language:'Langue',mode:'Mode',manual:'Champ personnalisé',random:'Champ aléatoire',configure:'Configurer le champ',save:'Enregistrer',next:'Coup suivant',round:'Nouveau tour',settings:'Paramètres',move:'Coup',cell:'case',finish:'Terminé'}};let level=rows-1,lang='en';function localize(){const t=copy[lang];$('#languageLabel').textContent=t.language;$('#modeLabel').textContent=t.mode;$('#manualOption').textContent=t.manual;$('#randomOption').textContent=t.random;$('#config').textContent=t.configure;$('#save').textContent=t.save;$('#next').textContent=level<0?t.finish:t.next;$('#reset').textContent=t.round;$('#settings').setAttribute('aria-label',t.settings);}function build(){$('#ladder').innerHTML=Array.from({length:rows},(_,i)=>'<div class="row" data-level="'+i+'">'+Array.from({length:5},()=>'<div class="slot"></div>').join('')+'</div>').join('');}function renderConfig(){const t=copy[lang];$('#configPanel').innerHTML=plan.map((column,row)=>'<div class="plan-row"><span>'+t.move+' '+(rows-row)+'</span>'+Array.from({length:5},(_,col)=>'<button type="button" class="plan-cell '+(column===col?'active':'')+'" data-row="'+row+'" data-col="'+col+'" aria-label="'+t.move+' '+(rows-row)+', '+t.cell+' '+(col+1)+'"></button>').join('')+'</div>').join('');}function reset(){level=rows-1;build();$('#next').disabled=false;localize();}function next(){if(level<0)return;const shownLevel=level,row=root.querySelector('.row[data-level="'+shownLevel+'"]'),cells=[...row.querySelectorAll('.slot')],column=$('#mode').value==='random'||plan[shownLevel]===null?Math.floor(Math.random()*cells.length):plan[shownLevel],cell=cells[column];row.classList.add('played');cell.classList.add('apple');cell.innerHTML='<span class="icon">🍎</span>';level--;if(level<0){$('#next').textContent=copy[lang].finish;$('#next').disabled=true;}}$('#settings').onclick=()=>{$('#settingsPanel').classList.toggle('open');};$('#config').onclick=()=>{const panel=$('#configPanel'),open=panel.classList.toggle('open');if(open)renderConfig();};$('#configPanel').onclick=event=>{const button=event.target.closest('button[data-row]');if(!button)return;plan[+button.dataset.row]=+button.dataset.col;renderConfig();};$('#save').onclick=()=>{$('#configPanel').classList.remove('open');$('#settingsPanel').classList.remove('open');};$('#language').onchange=event=>{lang=event.target.value;localize();if($('#configPanel').classList.contains('open'))renderConfig();};$('#next').onclick=next;$('#reset').onclick=reset;localize();reset();})();
  </script>
</div>
</body>
</html>
