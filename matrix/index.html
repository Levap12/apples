<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CEDRIC PRO // MATRIX</title>
  <meta name="theme-color" content="#020806">
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <style>
    :root{color-scheme:dark;--bg:#020806;--panel:#07120f;--line:#123c31;--green:#39ff88;--green-soft:#1cbf68;--cyan:#3eeaff;--danger:#ff315f;--text:#d8ffec;--muted:#75a98e}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#020806;color:var(--text)}
    body{padding:14px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;background:radial-gradient(circle at 50% 20%,#0b3928 0,transparent 40%),repeating-linear-gradient(0deg,#020806 0 21px,#062017 22px),linear-gradient(135deg,#020806,#071710);background-attachment:fixed}
    .app{width:min(100%,520px);margin:auto;position:relative;border:1px solid #1f7653;background:linear-gradient(180deg,#071710f2,#020806f7);box-shadow:0 0 0 1px #06100c,0 0 40px #00ff7733,inset 0 0 30px #00ff7712;overflow:hidden;clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px)}
    .app:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,transparent 0 3px,#8affbd07 4px);mix-blend-mode:screen}
    .top{position:relative;padding:16px 16px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#06100d,#0a251a 50%,#06100d)}
    .title{margin:0;font-size:clamp(22px,6vw,34px);letter-spacing:.12em;font-weight:700;text-shadow:0 0 14px #39ff8888}.title span{color:var(--cyan)}
    .terminal-line{margin-top:8px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}.terminal-line b{color:var(--green);font-weight:500}
    .field{padding:13px;background:radial-gradient(circle at center,#0b221a,#030a08 78%)}
    .grid{display:grid;gap:6px;position:relative}
    .row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;position:relative}
    .cell{aspect-ratio:1.32;position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid #174d3b;background:linear-gradient(145deg,#0c2119,#06100d 64%);box-shadow:inset 0 0 0 1px #07110d,0 0 9px #00ff7710;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
    .cell:before{content:"";position:absolute;inset:5px;border:1px solid #0d2e23;background:repeating-linear-gradient(90deg,transparent 0 11px,#0f302511 12px)}
    .cell:after{content:attr(data-code);position:absolute;left:6px;top:4px;color:#2e7058;font-size:7px;letter-spacing:.05em}
    .row.safe{animation:row-scan .45s ease both;animation-delay:var(--delay)}
    .row.safe .cell{border-color:#208f5d;box-shadow:inset 0 0 15px #00ff7730,0 0 10px #00ff7733}
    .cell.apple{background:radial-gradient(circle at 50% 50%,#103c28,#07140f 70%);border-color:var(--green);animation:unlock .5s cubic-bezier(.2,.75,.25,1.25) both;animation-delay:var(--delay)}
    .apple-icon{position:relative;z-index:2;font-family:system-ui,sans-serif;font-size:clamp(22px,6vw,38px);filter:drop-shadow(0 0 8px #ff315f);transform:translateY(2px)}
    .row.blocked{animation:block-in .28s ease both;animation-delay:var(--delay)}
    .row.blocked .cell{border-color:#5f1830;background:linear-gradient(145deg,#1b0b11,#090507);box-shadow:inset 0 0 15px #ff315f17}
    .danger-x{position:relative;z-index:2;color:var(--danger);font:700 clamp(24px,7vw,42px)/1 system-ui;text-shadow:0 0 9px #ff315f;transform:rotate(-4deg)}
    .row.blocked:after{content:"LOCKED";position:absolute;right:6px;top:50%;translate:0 -50%;z-index:3;padding:2px 4px;color:#ff8aa4;background:#1b060ddd;border:1px solid #6d1932;font-size:7px;letter-spacing:.16em}
    @keyframes row-scan{from{opacity:.15;transform:translateX(-12px)}to{opacity:1;transform:none}}
    @keyframes unlock{0%{opacity:0;transform:scale(.45) rotate(-9deg)}70%{transform:scale(1.12) rotate(2deg)}100%{opacity:1;transform:scale(1)}}
    @keyframes block-in{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}}
    .bottom{position:relative;padding:13px 16px 15px;border-top:1px solid var(--line);background:#050d0a}
    .action{width:100%;border:1px solid var(--green);padding:12px 16px;background:linear-gradient(90deg,#0a2b1d,#0d3b27,#0a2b1d);color:#d8ffec;font:700 13px/1 inherit;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 0 18px #39ff8820,0 0 13px #39ff8833;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
    .action:hover{filter:brightness(1.17)}.action:disabled{opacity:.55;cursor:wait}
    .gear{position:absolute;right:9px;top:9px;z-index:12;width:30px;height:30px;border:1px solid #1b5943;background:#06100dcc;color:#6fc49b;font:17px system-ui;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
    .settings{display:none;position:absolute;right:42px;top:9px;z-index:11;width:min(270px,calc(100% - 58px));padding:12px;border:1px solid #23865d;background:#06100df2;box-shadow:0 12px 30px #000,inset 0 0 22px #00ff7710}.settings.open{display:grid;gap:10px}.settings label{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;color:#9bd5b6;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.settings select{border:1px solid #217550;background:#071710;color:var(--text);padding:6px 8px;font:11px inherit}.hint{color:#4f8a6b;font-size:8px;line-height:1.45;letter-spacing:.05em}
    @media(max-width:600px){body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}.app{margin:0 auto}.top{padding:13px 12px 10px}.field{padding:9px}.grid,.row{gap:4px}.bottom{padding:10px 12px 12px}}
  </style>
</head>
<body>
  <section class="app" aria-label="CEDRIC PRO simulator">
    <button class="gear" id="settingsButton" type="button" aria-label="Settings">⚙</button>
    <aside class="settings" id="settingsPanel">
      <label><span id="depthLabel">Safe rows</span><select id="depth"><option value="4">4</option><option value="5" selected>5</option></select></label>
      <label><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="fr">Français</option></select></label>
      <div class="hint" id="settingsHint">One random column will be unlocked on every safe row.</div>
    </aside>
    <header class="top">
      <h1 class="title">CEDRIC <span>PRO</span></h1>
      <div class="terminal-line"><span id="statusLabel">SYSTEM: <b>READY</b></span><span>NODE_05</span></div>
    </header>
    <main class="field"><div class="grid" id="grid" aria-label="Game field"></div></main>
    <footer class="bottom"><button class="action" id="scan" type="button">RUN SAFE SCAN</button></footer>
  </section>
  <script>
    (()=>{
      const rows=9,cols=5,grid=document.querySelector('#grid'),scan=document.querySelector('#scan'),settingsButton=document.querySelector('#settingsButton'),settingsPanel=document.querySelector('#settingsPanel'),depth=document.querySelector('#depth'),language=document.querySelector('#language');
      const text={en:{depth:'Safe rows',language:'Language',hint:'One random column will be unlocked on every safe row.',settings:'Settings',ready:'SYSTEM: <b>READY</b>',scanning:'SYSTEM: <b>SCANNING</b>',complete:'SYSTEM: <b>PATH FOUND</b>',scan:'RUN SAFE SCAN',reset:'NEW SCAN',field:'Game field'},fr:{depth:'Lignes sûres',language:'Langue',hint:'Une colonne aléatoire sera déverrouillée sur chaque ligne sûre.',settings:'Paramètres',ready:'SYSTÈME : <b>PRÊT</b>',scanning:'SYSTÈME : <b>ANALYSE</b>',complete:'SYSTÈME : <b>CHEMIN TROUVÉ</b>',scan:'LANCER L’ANALYSE',reset:'NOUVELLE ANALYSE',field:'Champ de jeu'}};
      let revealed=false,running=false;
      const $=s=>document.querySelector(s),t=()=>text[language.value];
      function build(){grid.innerHTML=Array.from({length:rows},(_,row)=>`<div class="row" data-row="${row}">${Array.from({length:cols},(_,col)=>`<div class="cell" data-code="${String(rows-row).padStart(2,'0')}.${String(col+1).padStart(2,'0')}"></div>`).join('')}</div>`).join('');}
      function localize(){const c=t();$('#depthLabel').textContent=c.depth;$('#languageLabel').textContent=c.language;$('#settingsHint').textContent=c.hint;settingsButton.setAttribute('aria-label',c.settings);grid.setAttribute('aria-label',c.field);scan.textContent=revealed?c.reset:c.scan;$('#statusLabel').innerHTML=revealed?c.complete:c.ready;}
      function reset(){revealed=false;running=false;build();scan.disabled=false;localize();}
      function reveal(){if(running)return;if(revealed){reset();return}running=true;scan.disabled=true;settingsPanel.classList.remove('open');const safe=Number(depth.value),start=rows-safe,blockedStart=safe*120+700;for(let row=0;row<rows;row++){const rowEl=grid.querySelector(`[data-row="${row}"]`),step=rows-1-row;if(row>=start){const delay=step*120;rowEl.classList.add('safe');rowEl.style.setProperty('--delay',`${delay}ms`);const column=Math.floor(Math.random()*cols),cell=rowEl.children[column];cell.classList.add('apple');cell.style.setProperty('--delay',`${delay+80}ms`);cell.innerHTML='<span class="apple-icon">🍎</span>';}else{const delay=blockedStart+(start-1-row)*95;rowEl.classList.add('blocked');rowEl.style.setProperty('--delay',`${delay}ms`);[...rowEl.children].forEach(cell=>cell.innerHTML='<span class="danger-x">×</span>');}}$('#statusLabel').innerHTML=t().scanning;setTimeout(()=>{revealed=true;running=false;scan.disabled=false;localize();},blockedStart+start*95+350);}
      settingsButton.addEventListener('click',()=>settingsPanel.classList.toggle('open'));
      language.addEventListener('change',localize);
      depth.addEventListener('change',()=>{if(revealed)reset()});
      scan.addEventListener('click',reveal);
      build();localize();
      if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
    })();
  </script>
</body>
</html>
